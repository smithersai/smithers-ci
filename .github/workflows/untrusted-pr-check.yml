name: Community PR Untrusted Preview (Read-Only Cache)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  untrusted-preview:
    name: Untrusted Community Preview (Cannot Write Cache or Clear Gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fast-check and untrusted Lighthouse preview
        env:
          SMITHERS_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          # Explicitly NEVER pass SMITHERS_CACHE_WRITE_TOKEN or deploy secrets here.
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
        run: |
          bun run fast-check
          bun run wiki:check
          bun run home:check
          bun run history:verify
          bun run audit:untrusted
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(".smithers/reports-untrusted/lighthouse-audit.json", "utf8"));
            if (r.gate.satisfied !== false) {
              console.error("SECURITY VIOLATION: untrusted PR run must never satisfy a gate");
              process.exit(1);
            }
            const lines = [
              "## Untrusted Community Preview (" + r.policy.provenanceBadge + ")",
              "",
              "Thank you for contributing! Your preview ran with warm read-only cache access.",
              "",
              "**Preview Score:** `" + r.overallScore + "/100` | **Gate Status:** `" + r.gate.status + "` (maintainer or controlled sandbox rerun required to merge)",
              "",
              "| Category | Score |",
              "| --- | ---: |",
              ...r.categories.map(c => `| ${c.title} | **${c.score}** |`)
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload isolated untrusted preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: untrusted-preview-${{ github.event.pull_request.head.sha }}
          path: |
            .smithers/reports-untrusted/lighthouse-audit.json
            .smithers/reports-untrusted/lighthouse-audit.html
