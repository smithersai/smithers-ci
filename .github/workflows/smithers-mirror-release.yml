name: Smithers Mirror -> Trusted Audit, Docs Publish & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: smithers-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-audit-and-build:
    name: Trusted Lighthouse Backpressure Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full trusted backpressure checks and Lighthouse audit
        env:
          SMITHERS_COMMIT_SHA: ${{ github.sha }}
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          SMITHERS_CACHE_WRITE_TOKEN: ${{ secrets.SMITHERS_CACHE_WRITE_TOKEN }}
          SMITHERS_CONTROL_SECRET: ${{ secrets.SMITHERS_CONTROL_SECRET }}
        run: |
          bun run full-check
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(".smithers/reports/lighthouse-audit.json", "utf8"));
            const lines = [
              "## Smithers CI Lighthouse Backpressure Audit (" + r.policy.provenanceBadge + ")",
              "",
              "**Overall Score:** `" + r.overallScore + "/100` | **Gate:** `" + r.gate.status + "`",
              "",
              "| Category | Score | Passed | Warnings | Failed |",
              "| --- | ---: | ---: | ---: | ---: |",
              ...r.categories.map(c => `| ${c.title} | **${c.score}** | ${c.passedCount} | ${c.warnCount} | ${c.failCount} |`)
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload Lighthouse Audit & Factory UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smithers-ci-trusted-bundle-${{ github.sha }}
          path: |
            .smithers/reports/lighthouse-audit.json
            .smithers/reports/lighthouse-audit.html
            dist/ui/
            wiki/llms.txt
            history/manifest.json

  publish-docs-and-factory:
    name: Publish Docs, Wiki & Factory UI to Cloudflare
    needs: [trusted-audit-and-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built Factory UI bundle
        uses: actions/download-artifact@v4
        with:
          name: smithers-ci-trusted-bundle-${{ github.sha }}

      - name: Deploy Factory UI, Wiki, and Cloud MCP Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy

      - name: Record pending Cloudflare token notice
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN secret not configured on this mirror yet. Built dist/ui bundle verified and archived."

  publish-release:
    name: Publish npm Package & GitHub Release
    needs: [trusted-audit-and-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js with npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download verified Lighthouse Audit artifact
        uses: actions/download-artifact@v4
        with:
          name: smithers-ci-trusted-bundle-${{ github.sha }}

      - name: Publish to npm with provenance
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag next --provenance

      - name: Create GitHub Release with Lighthouse Audit attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            .smithers/reports/lighthouse-audit.html \
            .smithers/reports/lighthouse-audit.json \
            history/manifest.json \
            --title "Smithers CI ${GITHUB_REF_NAME}" \
            --notes "Automated release triggered by Smithers Cloud mirror merge. Includes verified Lighthouse Backpressure Audit and Mythical History manifest."
