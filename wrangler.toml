name = "smithers-ci-factory"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist/ui"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/llms.txt", "/wiki/*", "/api/*", "/mcp", "/smithersai/*", "/.well-known/*"]

[durable_objects]
bindings = [
  { name = "FACTORY_HUB", class_name = "FactoryHubDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FactoryHubDO"]

[vars]
SMITHERS_BASE_URL = "https://smithers-ci-factory.willcory10.workers.dev"
